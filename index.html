<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101114">
  <title>Яндекс Навигатор</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --card: #1c2028;
      --text: #f5f7fa;
      --muted: #b7c0cc;
      --yellow: #ffcc00;
      --ink: #1a1400;
      --line: #2a303a;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    main {
      max-width: 34rem;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: max(1.25rem, env(safe-area-inset-top)) 1.1rem max(1.5rem, env(safe-area-inset-bottom));
    }

    h1 {
      margin: 0 0 0.6rem;
      font-size: 1.85rem;
      line-height: 1.15;
      font-weight: 700;
    }

    h2 {
      margin: 1.35rem 0 0.55rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--muted);
    }

    p { margin: 0 0 0.9rem; }

    .muted { color: var(--muted); }

    .coords {
      margin: 0 0 1rem;
      font-size: 1.05rem;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .btn,
    .btn-alt,
    .btn-copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 3.6rem;
      padding: 0.85rem 1rem;
      border: 0;
      border-radius: 0.9rem;
      font: inherit;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      text-decoration: none;
      touch-action: manipulation;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn {
      min-height: 4.6rem;
      background: var(--yellow);
      color: var(--ink);
      font-size: 1.28rem;
    }

    .btn-alt {
      background: var(--card);
      color: var(--text);
      font-size: 1.05rem;
      border: 1px solid var(--line);
    }

    .btn-copy {
      background: transparent;
      color: var(--yellow);
      font-size: 1.05rem;
      border: 1px dashed var(--line);
    }

    .btn-label {
      display: block;
    }

    .btn-sub {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.82rem;
      font-weight: 500;
      opacity: 0.78;
    }

    .btn:active,
    .btn-alt:active,
    .btn-copy:active {
      filter: brightness(0.92);
    }

    .btn:focus-visible,
    .btn-alt:focus-visible,
    .btn-copy:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .hint {
      margin: 1.1rem 0 0;
      font-size: 0.98rem;
    }

    .hint strong {
      color: var(--text);
      font-weight: 700;
    }

    .example {
      display: block;
      margin: 0.4rem 0 1rem;
      padding: 0.85rem 0.9rem;
      border-radius: 0.75rem;
      background: var(--card);
      color: var(--text);
      word-break: break-word;
      text-decoration: none;
    }

    ul { margin: 0.2rem 0 1rem; padding-left: 1.2rem; }
    li { margin: 0.25rem 0; }

    .toast {
      margin: 0.35rem 0 0;
      min-height: 1.3em;
      font-size: 0.95rem;
      color: var(--yellow);
    }
  </style>
</head>
<body>
  <main id="app">
    <noscript>
      <h1>Нужен JavaScript</h1>
      <p class="muted">Страница собирает ссылку на Яндекс Навигатор из параметров адреса. Включите JavaScript и откройте ссылку ещё раз.</p>
    </noscript>
  </main>
  <script>
    (function () {
      var NAVI_PACKAGE = "ru.yandex.yandexnavi";
      var EXAMPLE = "https://us-kavalchuk.github.io/BydNavi/?lat=53.86&lon=27.45&name=Test";
      var app = document.getElementById("app");
      var params = new URLSearchParams(window.location.search);

      function isAndroid() {
        return /Android/i.test(navigator.userAgent || "");
      }

      function coord(raw, min, max) {
        if (raw == null) return null;
        var value = String(raw).trim().replace(",", ".");
        if (!/^[+-]?\d+(\.\d+)?$/.test(value)) return null;
        var number = Number(value);
        if (number < min || number > max) return null;
        return value;
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      function linkButton(href, className, title, subtitle) {
        var a = el("a", className);
        a.href = href;
        a.appendChild(el("span", "btn-label", title));
        if (subtitle) a.appendChild(el("span", "btn-sub", subtitle));
        return a;
      }

      function showHelp(intro) {
        document.title = "Ссылка на Яндекс Навигатор";
        app.textContent = "";
        app.appendChild(el("h1", null, "Ссылка на маршрут"));
        if (intro) app.appendChild(el("p", null, intro));
        app.appendChild(el("p", "muted", "Telegram делает кликабельными только обычные https-ссылки. Эта страница сразу открывает маршрут в приложении Яндекс Навигатор."));
        var list = document.createElement("ul");
        list.appendChild(el("li", null, "lat и lon — широта и долгота точки назначения, оба обязательны."));
        list.appendChild(el("li", null, "name — подпись места на этой странице."));
        list.appendChild(el("li", null, "lat_from и lon_from — откуда ехать. Если их нет, маршрут начнётся от текущего места."));
        app.appendChild(list);
        app.appendChild(el("p", "muted", "Пример:"));
        var link = el("a", "example", EXAMPLE);
        link.href = EXAMPLE;
        app.appendChild(link);
      }

      var lat = coord(params.get("lat"), -90, 90);
      var lon = coord(params.get("lon"), -180, 180);
      if (!lat || !lon) {
        var missing = params.has("lat") || params.has("lon") || params.has("lat_from") || params.has("lon_from");
        showHelp(missing ? "Координаты указаны неполно или неверно. Широта — от −90 до 90, долгота — от −180 до 180." : "");
        return;
      }

      var latFrom = coord(params.get("lat_from"), -90, 90);
      var lonFrom = coord(params.get("lon_from"), -180, 180);
      var hasFrom = !!(latFrom && lonFrom);
      var incompleteFrom = (params.get("lat_from") || params.get("lon_from")) && !hasFrom;
      var name = (params.get("name") || "").trim();

      var query = [];
      if (hasFrom) query.push("lat_from=" + latFrom, "lon_from=" + lonFrom);
      query.push("lat_to=" + lat, "lon_to=" + lon);
      var routeQuery = query.join("&");

      var scheme = "yandexnavi://build_route_on_map?" + routeQuery;
      // Browser form of ACTION_VIEW + setPackage("ru.yandex.yandexnavi").
      var intent = "intent://build_route_on_map?" + routeQuery
        + "#Intent;scheme=yandexnavi;package=" + NAVI_PACKAGE + ";end";

      var toPoint = lat + "," + lon;
      var rtext = hasFrom ? (latFrom + "," + lonFrom + "~" + toPoint) : ("~" + toPoint);
      var mapsWeb = "https://yandex.ru/maps/?rtext=" + encodeURIComponent(rtext) + "&rtt=auto";
      var mapsApp = "yandexmaps://maps.yandex.ru/?rtext=" + encodeURIComponent(rtext) + "&rtt=auto";

      // If the package cannot handle the intent, Chrome opens this URL.
      var intentFallback = "intent://build_route_on_map?" + routeQuery
        + "#Intent;scheme=yandexnavi;package=" + NAVI_PACKAGE
        + ";S.browser_fallback_url=" + encodeURIComponent(mapsWeb)
        + ";end";

      var android = isAndroid();
      var autoTarget = android ? intent : scheme;
      var copyText = hasFrom
        ? (latFrom + ", " + lonFrom + " → " + lat + ", " + lon)
        : (lat + ", " + lon);

      document.title = name ? (name + " — Навигатор") : "Яндекс Навигатор";
      app.textContent = "";
      app.appendChild(el("h1", null, name || "Маршрут"));

      var coords = el("p", "coords");
      if (hasFrom) {
        coords.appendChild(el("span", null, "Откуда: " + latFrom + ", " + lonFrom));
        coords.appendChild(document.createElement("br"));
        coords.appendChild(el("span", null, "Куда: " + lat + ", " + lon));
      } else {
        coords.textContent = lat + ", " + lon;
      }
      app.appendChild(coords);

      if (incompleteFrom) {
        app.appendChild(el("p", "muted", "Точка отправления указана не целиком, поэтому маршрут начнётся от текущего места."));
      }

      // Real <a href> links — do not intercept with preventDefault.
      // Head-unit Telegram WebViews often ignore location.href redirects
      // but still honor a direct user tap on an anchor.
      var primary = el("div", "actions");
      primary.appendChild(linkButton(
        android ? intent : scheme,
        "btn",
        "Открыть в Яндекс Навигаторе",
        android ? "intent:// · пакет ru.yandex.yandexnavi" : "yandexnavi://"
      ));
      app.appendChild(primary);

      var actions = el("div", "actions");
      if (android) {
        app.appendChild(el("h2", null, "Если кнопка не сработала (ГУ / Telegram)"));
        actions.appendChild(linkButton(
          scheme,
          "btn-alt",
          "Навигатор: прямая ссылка",
          "yandexnavi://build_route_on_map"
        ));
        actions.appendChild(linkButton(
          intent,
          "btn-alt",
          "Навигатор: Intent с пакетом",
          "intent:// · ru.yandex.yandexnavi"
        ));
        actions.appendChild(linkButton(
          intentFallback,
          "btn-alt",
          "Навигатор: Intent + запасной URL",
          "если приложения нет — откроются Карты в браузере"
        ));
        actions.appendChild(linkButton(
          mapsApp,
          "btn-alt",
          "Открыть в приложении Яндекс Карты",
          "yandexmaps://maps.yandex.ru"
        ));
      }

      actions.appendChild(linkButton(
        mapsWeb,
        "btn-alt",
        "Маршрут в Яндекс Картах (браузер)",
        "https://yandex.ru/maps"
      ));

      var copyBtn = el("button", "btn-copy", "Скопировать координаты");
      copyBtn.type = "button";
      actions.appendChild(copyBtn);

      var toast = el("p", "toast", "");
      actions.appendChild(toast);
      app.appendChild(actions);

      var hint = el("p", "hint muted");
      hint.appendChild(document.createTextNode(
        android
          ? "На телефоне страница пытается открыть Навигатор сама. На ГУ Telegram часто блокирует intent:// и yandexnavi:// во встроенном браузере — тогда нажмите ⋮ / меню и выберите «"
          : "Если Навигатор не открылся сам, нажмите жёлтую кнопку. Если схема заблокирована, откройте страницу во внешнем браузере: «"
      ));
      hint.appendChild(el("strong", null, "Открыть в браузере"));
      hint.appendChild(document.createTextNode("», затем снова жёлтую кнопку."));
      app.appendChild(hint);

      function setToast(text) {
        toast.textContent = text;
      }

      function copyCoords() {
        function ok() { setToast("Скопировано: " + copyText); }
        function fail() { setToast("Не удалось скопировать. Выделите координаты вручную."); }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(copyText).then(ok, function () {
            fallbackCopy(copyText) ? ok() : fail();
          });
          return;
        }
        fallbackCopy(copyText) ? ok() : fail();
      }

      function fallbackCopy(text) {
        try {
          var area = document.createElement("textarea");
          area.value = text;
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.left = "-9999px";
          document.body.appendChild(area);
          area.select();
          area.setSelectionRange(0, text.length);
          var done = document.execCommand("copy");
          document.body.removeChild(area);
          return done;
        } catch (err) {
          return false;
        }
      }

      copyBtn.addEventListener("click", copyCoords);

      // Auto-redirect for phones. Head-unit WebViews often ignore this;
      // the labeled buttons above are the real path there.
      try {
        window.location.href = autoTarget;
      } catch (err) {}
    })();
  </script>
</body>
</html>
