<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101114">
  <title>Яндекс Навигатор</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --card: #1c2028;
      --text: #f5f7fa;
      --muted: #b7c0cc;
      --yellow: #ffcc00;
      --ink: #1a1400;
      --line: #2a303a;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    main {
      max-width: 34rem;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: max(1.25rem, env(safe-area-inset-top)) 1.1rem max(1.5rem, env(safe-area-inset-bottom));
    }

    h1 {
      margin: 0 0 0.6rem;
      font-size: 1.85rem;
      line-height: 1.15;
      font-weight: 700;
    }

    h2 {
      margin: 1.35rem 0 0.55rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--muted);
    }

    p { margin: 0 0 0.9rem; }

    .muted { color: var(--muted); }

    .coords {
      margin: 0 0 1rem;
      font-size: 1.05rem;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .btn,
    .btn-alt,
    .btn-copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 3.6rem;
      padding: 0.85rem 1rem;
      border: 0;
      border-radius: 0.9rem;
      font: inherit;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      text-decoration: none;
      touch-action: manipulation;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn {
      min-height: 4.6rem;
      background: var(--yellow);
      color: var(--ink);
      font-size: 1.28rem;
    }

    .btn-alt {
      background: var(--card);
      color: var(--text);
      font-size: 1.05rem;
      border: 1px solid var(--line);
    }

    .btn-copy {
      background: transparent;
      color: var(--yellow);
      font-size: 1.05rem;
      border: 1px dashed var(--line);
    }

    .btn-label { display: block; }

    .btn-sub {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.82rem;
      font-weight: 500;
      opacity: 0.78;
    }

    .btn:active,
    .btn-alt:active,
    .btn-copy:active {
      filter: brightness(0.92);
    }

    .btn:focus-visible,
    .btn-alt:focus-visible,
    .btn-copy:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .hint {
      margin: 1.1rem 0 0;
      font-size: 0.98rem;
    }

    .example {
      display: block;
      margin: 0.4rem 0 1rem;
      padding: 0.85rem 0.9rem;
      border-radius: 0.75rem;
      background: var(--card);
      color: var(--text);
      word-break: break-word;
      text-decoration: none;
    }

    ul { margin: 0.2rem 0 1rem; padding-left: 1.2rem; }
    li { margin: 0.25rem 0; }

    .toast {
      margin: 0.35rem 0 0;
      min-height: 1.3em;
      font-size: 0.95rem;
      color: var(--yellow);
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }
  </style>
</head>
<body>
  <main id="app">
    <noscript>
      <h1>Нужен JavaScript</h1>
      <p class="muted">Страница собирает ссылку на навигатор из параметров адреса. Включите JavaScript и откройте ссылку ещё раз.</p>
    </noscript>
  </main>
  <script>
    (function () {
      var NAVI_PACKAGE = "ru.yandex.yandexnavi";
      var EXAMPLE = "https://us-kavalchuk.github.io/BydNavi/?lat=53.86&lon=27.45&name=Test";
      var app = document.getElementById("app");
      var params = new URLSearchParams(window.location.search);

      function isAndroid() {
        return /Android/i.test(navigator.userAgent || "");
      }

      function coord(raw, min, max) {
        if (raw == null) return null;
        var value = String(raw).trim().replace(",", ".");
        if (!/^[+-]?\d+(\.\d+)?$/.test(value)) return null;
        var number = Number(value);
        if (number < min || number > max) return null;
        return value;
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      function linkButton(href, className, title, subtitle) {
        var a = el("a", className);
        a.href = href;
        a.appendChild(el("span", "btn-label", title));
        if (subtitle) a.appendChild(el("span", "btn-sub", subtitle));
        return a;
      }

      function showHelp(intro) {
        document.title = "Ссылка на навигатор";
        app.textContent = "";
        app.appendChild(el("h1", null, "Ссылка на маршрут"));
        if (intro) app.appendChild(el("p", null, intro));
        app.appendChild(el("p", "muted", "Telegram делает кликабельными только обычные https-ссылки. Эта страница открывает маршрут в Яндекс Навигаторе или в другом навигаторе по выбору."));
        var list = document.createElement("ul");
        list.appendChild(el("li", null, "lat и lon — широта и долгота точки назначения, оба обязательны."));
        list.appendChild(el("li", null, "name — подпись места на этой странице."));
        list.appendChild(el("li", null, "lat_from и lon_from — откуда ехать. Если их нет, маршрут начнётся от текущего места."));
        list.appendChild(el("li", null, "app — какой навигатор открыть сразу: yandex (по умолчанию), google, waze, 2gis, apple, here, sygic, organic, osmand, geo."));
        app.appendChild(list);
        app.appendChild(el("p", "muted", "Пример:"));
        var link = el("a", "example", EXAMPLE);
        link.href = EXAMPLE;
        app.appendChild(link);
      }

      var lat = coord(params.get("lat"), -90, 90);
      var lon = coord(params.get("lon"), -180, 180);
      if (!lat || !lon) {
        var missing = params.has("lat") || params.has("lon") || params.has("lat_from") || params.has("lon_from");
        showHelp(missing ? "Координаты указаны неполно или неверно. Широта — от −90 до 90, долгота — от −180 до 180." : "");
        return;
      }

      var latFrom = coord(params.get("lat_from"), -90, 90);
      var lonFrom = coord(params.get("lon_from"), -180, 180);
      var hasFrom = !!(latFrom && lonFrom);
      var incompleteFrom = (params.get("lat_from") || params.get("lon_from")) && !hasFrom;
      var name = (params.get("name") || "").trim();
      var appParam = (params.get("app") || "yandex").trim().toLowerCase();

      var query = [];
      if (hasFrom) query.push("lat_from=" + latFrom, "lon_from=" + lonFrom);
      query.push("lat_to=" + lat, "lon_to=" + lon);
      var routeQuery = query.join("&");

      var scheme = "yandexnavi://build_route_on_map?" + routeQuery;
      // Browser form of ACTION_VIEW + setPackage("ru.yandex.yandexnavi").
      var intent = "intent://build_route_on_map?" + routeQuery
        + "#Intent;scheme=yandexnavi;package=" + NAVI_PACKAGE + ";end";

      var toPoint = lat + "," + lon;
      var rtext = hasFrom ? (latFrom + "," + lonFrom + "~" + toPoint) : ("~" + toPoint);
      var mapsWeb = "https://yandex.ru/maps/?rtext=" + encodeURIComponent(rtext) + "&rtt=auto";

      var android = isAndroid();
      var yandexTarget = android ? intent : scheme;

      // Destination-only / A→B builders for other apps (official docs).
      // 2GIS: lon,lat order. Prefer https (opens app or web).
      var dgisPath = hasFrom
        ? ("/routeSearch/rsType/car/from/" + lonFrom + "," + latFrom + "/to/" + lon + "," + lat)
        : ("/routeSearch/rsType/car/to/" + lon + "," + lat);
      var dgisApp = "dgis://2gis.ru" + dgisPath;
      var dgisWeb = "https://2gis.ru" + dgisPath;

      var google = "https://www.google.com/maps/dir/?api=1&destination="
        + encodeURIComponent(toPoint)
        + (hasFrom ? ("&origin=" + encodeURIComponent(latFrom + "," + lonFrom)) : "")
        + "&travelmode=driving";

      var waze = "https://waze.com/ul?ll=" + encodeURIComponent(toPoint) + "&navigate=yes";

      var apple = "https://maps.apple.com/?daddr=" + encodeURIComponent(toPoint)
        + (hasFrom ? ("&saddr=" + encodeURIComponent(latFrom + "," + lonFrom)) : "")
        + "&dirflg=d";

      var here = "https://share.here.com/r/"
        + (hasFrom ? (latFrom + "," + lonFrom) : "mylocation")
        + "/" + toPoint
        + (name ? ("," + encodeURIComponent(name)) : "")
        + "?m=d";

      // Sygic consumer universal link (legacy com.sygic.aura:// no longer builds routes).
      var sygic = "https://go.sygic.com/directions?to=" + encodeURIComponent(toPoint)
        + (hasFrom ? ("&from=" + encodeURIComponent(latFrom + "," + lonFrom)) : "");

      var organic = "om://v2/nav?origin="
        + (hasFrom ? encodeURIComponent(latFrom + "," + lonFrom) : "currentLocation")
        + "&destination=" + encodeURIComponent(toPoint)
        + (name ? ("&destination_name=" + encodeURIComponent(name)) : "")
        + "&mode=drive";

      var osmand = hasFrom
        ? ("https://osmand.net/map/?start=" + encodeURIComponent(latFrom + "," + lonFrom)
          + "&finish=" + encodeURIComponent(toPoint) + "&type=osmand&profile=car#"
          + "14/" + lat + "/" + lon)
        : ("https://osmand.net/map/?pin=" + encodeURIComponent(toPoint)
          + "#14/" + lat + "/" + lon);

      var geo = "geo:" + toPoint
        + (name ? ("(" + encodeURIComponent(name) + ")") : "");

      var otherApps = [
        { id: "2gis", href: dgisWeb, title: "2ГИС · 2GIS", sub: "https://2gis.ru/routeSearch · app: 2gis" },
        { id: "google", href: google, title: "Google Maps", sub: "maps/dir · app: google" },
        { id: "waze", href: waze, title: "Waze", sub: "waze.com/ul · app: waze" },
        { id: "apple", href: apple, title: "Apple Maps", sub: "maps.apple.com · app: apple" },
        { id: "here", href: here, title: "HERE WeGo", sub: "share.here.com · app: here" },
        { id: "sygic", href: sygic, title: "Sygic", sub: "go.sygic.com · app: sygic" },
        { id: "organic", href: organic, title: "Organic Maps", sub: "om://v2/nav · app: organic" },
        { id: "osmand", href: osmand, title: "OsmAnd", sub: "osmand.net/map · app: osmand" },
        { id: "geo", href: geo, title: "Выбрать приложение · geo:", sub: "Android · app: geo" }
      ];

      var aliases = {
        yandex: "yandex",
        navi: "yandex",
        yandexnavi: "yandex",
        "2gis": "2gis",
        dgis: "2gis",
        google: "google",
        gmaps: "google",
        waze: "waze",
        apple: "apple",
        applemaps: "apple",
        here: "here",
        wego: "here",
        sygic: "sygic",
        organic: "organic",
        organicmaps: "organic",
        om: "organic",
        osmand: "osmand",
        geo: "geo"
      };
      var selected = aliases[appParam] || "yandex";

      var autoTarget = yandexTarget;
      if (selected === "2gis") autoTarget = dgisWeb;
      else if (selected === "google") autoTarget = google;
      else if (selected === "waze") autoTarget = waze;
      else if (selected === "apple") autoTarget = apple;
      else if (selected === "here") autoTarget = here;
      else if (selected === "sygic") autoTarget = sygic;
      else if (selected === "organic") autoTarget = organic;
      else if (selected === "osmand") autoTarget = osmand;
      else if (selected === "geo") autoTarget = geo;

      var copyText = hasFrom
        ? (latFrom + ", " + lonFrom + " → " + lat + ", " + lon)
        : (lat + ", " + lon);

      document.title = name ? (name + " — Навигатор") : "Яндекс Навигатор";
      app.textContent = "";
      app.appendChild(el("h1", null, name || "Маршрут"));

      var coords = el("p", "coords");
      if (hasFrom) {
        coords.appendChild(el("span", null, "Откуда: " + latFrom + ", " + lonFrom));
        coords.appendChild(document.createElement("br"));
        coords.appendChild(el("span", null, "Куда: " + lat + ", " + lon));
      } else {
        coords.textContent = lat + ", " + lon;
      }
      app.appendChild(coords);

      if (incompleteFrom) {
        app.appendChild(el("p", "muted", "Точка отправления указана не целиком, поэтому маршрут начнётся от текущего места."));
      }

      if (!aliases[appParam]) {
        app.appendChild(el("p", "muted", "Неизвестный app=" + appParam + " — открываем Яндекс Навигатор."));
      } else if (selected !== "yandex") {
        app.appendChild(el("p", "muted", "Автопереход: " + selected + ". Жёлтая кнопка по-прежнему открывает Яндекс Навигатор."));
      }

      // Keep Yandex primary exactly as before: real <a>, Android intent / else scheme.
      var primary = el("div", "actions");
      primary.appendChild(linkButton(
        yandexTarget,
        "btn",
        "Открыть в Яндекс Навигаторе",
        android ? "intent:// · пакет ru.yandex.yandexnavi" : "yandexnavi://"
      ));
      app.appendChild(primary);

      var yandexExtras = el("div", "actions");
      yandexExtras.appendChild(linkButton(
        mapsWeb,
        "btn-alt",
        "Маршрут в Яндекс Картах (браузер)",
        "https://yandex.ru/maps"
      ));

      var copyBtn = el("button", "btn-copy", "Скопировать координаты");
      copyBtn.type = "button";
      yandexExtras.appendChild(copyBtn);

      var toast = el("p", "toast", "");
      yandexExtras.appendChild(toast);
      app.appendChild(yandexExtras);

      app.appendChild(el("h2", null, "Другие навигаторы · Other navigators"));
      var others = el("div", "actions");
      for (var i = 0; i < otherApps.length; i++) {
        var item = otherApps[i];
        others.appendChild(linkButton(item.href, "btn-alt", item.title, item.sub));
      }
      // Extra: direct dgis:// for those who prefer the app scheme over https.
      others.appendChild(linkButton(
        dgisApp,
        "btn-alt",
        "2ГИС · dgis://",
        "dgis://2gis.ru/routeSearch · если https не открыл приложение"
      ));
      app.appendChild(others);

      app.appendChild(el(
        "p",
        "hint muted",
        selected === "yandex"
          ? "Если Навигатор не открылся сам, нажмите жёлтую кнопку."
          : "Ссылка с app=" + selected + " сразу открывает выбранный навигатор. Жёлтая кнопка всегда ведёт в Яндекс Навигатор."
      ));

      function setToast(text) {
        toast.textContent = text;
      }

      function copyCoords() {
        function ok() { setToast("Скопировано: " + copyText); }
        function fail() { setToast("Не удалось скопировать. Выделите координаты вручную."); }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(copyText).then(ok, function () {
            fallbackCopy(copyText) ? ok() : fail();
          });
          return;
        }
        fallbackCopy(copyText) ? ok() : fail();
      }

      function fallbackCopy(text) {
        try {
          var area = document.createElement("textarea");
          area.value = text;
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.left = "-9999px";
          document.body.appendChild(area);
          area.select();
          area.setSelectionRange(0, text.length);
          var done = document.execCommand("copy");
          document.body.removeChild(area);
          return done;
        } catch (err) {
          return false;
        }
      }

      copyBtn.addEventListener("click", copyCoords);

      try {
        window.location.href = autoTarget;
      } catch (err) {}
    })();
  </script>
</body>
</html>
