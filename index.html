<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101114">
  <title>Navigator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --card: #1c2028;
      --text: #f5f7fa;
      --muted: #b7c0cc;
      --yellow: #ffcc00;
      --ink: #1a1400;
      --line: #2a303a;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    main {
      max-width: 34rem;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: max(1.25rem, env(safe-area-inset-top)) 1.1rem max(1.5rem, env(safe-area-inset-bottom));
    }

    h1 {
      margin: 0 0 0.6rem;
      font-size: 1.85rem;
      line-height: 1.15;
      font-weight: 700;
    }

    h2 {
      margin: 1.35rem 0 0.55rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--muted);
    }

    p { margin: 0 0 0.9rem; }

    .muted { color: var(--muted); }

    .coords {
      margin: 0 0 1rem;
      font-size: 1.05rem;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .btn,
    .btn-alt,
    .btn-copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 3.6rem;
      padding: 0.85rem 1rem;
      border: 0;
      border-radius: 0.9rem;
      font: inherit;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      text-decoration: none;
      touch-action: manipulation;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn {
      min-height: 4.6rem;
      background: var(--yellow);
      color: var(--ink);
      font-size: 1.28rem;
    }

    .btn-alt {
      background: var(--card);
      color: var(--text);
      font-size: 1.05rem;
      border: 1px solid var(--line);
    }

    .btn-copy {
      background: transparent;
      color: var(--yellow);
      font-size: 1.05rem;
      border: 1px dashed var(--line);
    }

    .btn-label { display: block; }

    .btn-sub {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.82rem;
      font-weight: 500;
      opacity: 0.78;
    }

    .btn:active,
    .btn-alt:active,
    .btn-copy:active {
      filter: brightness(0.92);
    }

    .btn:focus-visible,
    .btn-alt:focus-visible,
    .btn-copy:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .hint {
      margin: 1.1rem 0 0;
      font-size: 0.98rem;
    }

    .example {
      display: block;
      margin: 0.4rem 0 1rem;
      padding: 0.85rem 0.9rem;
      border-radius: 0.75rem;
      background: var(--card);
      color: var(--text);
      word-break: break-word;
      text-decoration: none;
    }

    ul { margin: 0.2rem 0 1rem; padding-left: 1.2rem; }
    li { margin: 0.25rem 0; }

    .toast {
      margin: 0.35rem 0 0;
      min-height: 1.3em;
      font-size: 0.95rem;
      color: var(--yellow);
    }
  </style>
</head>

      };

      function normalizeLang(code) {
        var base = String(code || "").toLowerCase().split(/[-_]/)[0];
        if (base === "be") return "ru";
        return I18N[base] ? base : "";
      }

      function pickLang() {
        var override = normalizeLang(params.get("lang"));
        if (override) return override;
        var list = navigator.languages && navigator.languages.length
          ? navigator.languages
          : [navigator.language || navigator.userLanguage || "en"];
        for (var i = 0; i < list.length; i++) {
          var hit = normalizeLang(list[i]);
          if (hit) return hit;
        }
        return "en";
      }

      var lang = pickLang();
      var t = I18N[lang] || I18N.en;
      document.documentElement.lang = lang;

      function msg(key, vars) {
        var text = t[key] || I18N.en[key] || key;
        if (!vars) return text;
        return text.replace(/\{(\w+)\}/g, function (_, name) {
          return vars[name] != null ? String(vars[name]) : "";
        });
      }

      function isAndroid() {
        return /Android/i.test(navigator.userAgent || "");
      }

      function isIos() {
        return /iPhone|iPad|iPod/i.test(navigator.userAgent || "");
      }

      // Chrome / Telegram in-app browser form of ACTION_VIEW + setPackage.
      function androidIntent(pathAndQuery, scheme, packageName, fallbackUrl) {
        return "intent://" + pathAndQuery
          + "#Intent;scheme=" + scheme
          + ";package=" + packageName
          + ";S.browser_fallback_url=" + encodeURIComponent(fallbackUrl)
          + ";end";
      }

      function openUrl(androidUrl, iosUrl, webUrl) {
        if (isAndroid()) return androidUrl || webUrl;
        if (isIos()) return iosUrl || webUrl;
        return webUrl;
      }

      function coord(raw, min, max) {
        if (raw == null) return null;
        var value = String(raw).trim().replace(",", ".");
        if (!/^[+-]?\d+(\.\d+)?$/.test(value)) return null;
        var number = Number(value);
        if (number < min || number > max) return null;
        return value;
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      function linkButton(href, className, title, subtitle) {
        var a = el("a", className);
        a.href = href;
        a.appendChild(el("span", "btn-label", title));
        if (subtitle) a.appendChild(el("span", "btn-sub", subtitle));
        return a;
      }

      function showHelp(intro) {
        document.title = msg("helpTitle");
        app.textContent = "";
        app.appendChild(el("h1", null, msg("helpTitle")));
        if (intro) app.appendChild(el("p", null, intro));
        app.appendChild(el("p", "muted", msg("helpTelegram")));
        var list = document.createElement("ul");
        list.appendChild(el("li", null, msg("helpLatLon")));
        list.appendChild(el("li", null, msg("helpName")));
        list.appendChild(el("li", null, msg("helpFrom")));
        list.appendChild(el("li", null, msg("helpApp")));
        list.appendChild(el("li", null, msg("helpLang")));
        app.appendChild(list);
        app.appendChild(el("p", "muted", msg("helpExample")));
        var link = el("a", "example", EXAMPLE);
        link.href = EXAMPLE;
        app.appendChild(link);
      }

      var lat = coord(params.get("lat"), -90, 90);
      var lon = coord(params.get("lon"), -180, 180);
      if (!lat || !lon) {
        var missing = params.has("lat") || params.has("lon") || params.has("lat_from") || params.has("lon_from");
        showHelp(missing ? msg("badCoords") : "");
        return;
      }

      var latFrom = coord(params.get("lat_from"), -90, 90);
      var lonFrom = coord(params.get("lon_from"), -180, 180);
      var hasFrom = !!(latFrom && lonFrom);
      var incompleteFrom = (params.get("lat_from") || params.get("lon_from")) && !hasFrom;
      var name = (params.get("name") || "").trim();
      var appParam = (params.get("app") || "yandex").trim().toLowerCase();

      var query = [];
      if (hasFrom) query.push("lat_from=" + latFrom, "lon_from=" + lonFrom);
      query.push("lat_to=" + lat, "lon_to=" + lon);
      var routeQuery = query.join("&");

      var scheme = "yandexnavi://build_route_on_map?" + routeQuery;
      // Browser form of ACTION_VIEW + setPackage("ru.yandex.yandexnavi").
      var intent = "intent://build_route_on_map?" + routeQuery
        + "#Intent;scheme=yandexnavi;package=" + NAVI_PACKAGE + ";end";

      var toPoint = lat + "," + lon;
      var android = isAndroid();
      var ios = isIos();
      var yandexTarget = android ? intent : scheme;

      // Other apps (official docs). 2GIS uses lon,lat.
      // https alone often stays in Telegram/Chrome; Android uses intent:// + package.
      var dgisPath = hasFrom
        ? ("/routeSearch/rsType/car/from/" + lonFrom + "," + latFrom + "/to/" + lon + "," + lat)
        : ("/routeSearch/rsType/car/to/" + lon + "," + lat);
      var dgisScheme = "dgis://2gis.ru" + dgisPath;
      var dgisWeb = "https://2gis.ru" + dgisPath;
      var dgis = openUrl(
        androidIntent("2gis.ru" + dgisPath, "dgis", "ru.dublgis.dgismobile", dgisWeb),
        dgisScheme,
        dgisWeb
      );

      var googleWeb = "https://www.google.com/maps/dir/?api=1&destination="
        + encodeURIComponent(toPoint)
        + (hasFrom ? ("&origin=" + encodeURIComponent(latFrom + "," + lonFrom)) : "")
        + "&travelmode=driving";
      var google = openUrl(
        androidIntent("q=" + toPoint + "&mode=d", "google.navigation", "com.google.android.apps.maps", googleWeb),
        googleWeb,
        googleWeb
      );

      var wazeWeb = "https://waze.com/ul?ll=" + encodeURIComponent(toPoint) + "&navigate=yes";
      var wazeIos = "waze://?ll=" + toPoint + "&navigate=yes";
      var waze = openUrl(
        androidIntent("ul?ll=" + toPoint + "&navigate=yes", "waze", "com.waze", wazeWeb),
        wazeIos,
        wazeWeb
      );

      var apple = "https://maps.apple.com/?daddr=" + encodeURIComponent(toPoint)
        + (hasFrom ? ("&saddr=" + encodeURIComponent(latFrom + "," + lonFrom)) : "")
        + "&dirflg=d";

      var hereWeb = "https://share.here.com/r/"
        + (hasFrom ? (latFrom + "," + lonFrom) : "mylocation")
        + "/" + toPoint
        + (name ? ("," + encodeURIComponent(name)) : "")
        + "?m=d";
      var here = openUrl(
        androidIntent("v1.0/mylocation/" + toPoint + "?m=d", "here.directions", "com.here.app.maps", hereWeb),
        hereWeb,
        hereWeb
      );

      var sygicWeb = "https://go.sygic.com/directions?to=" + encodeURIComponent(toPoint)
        + (hasFrom ? ("&from=" + encodeURIComponent(latFrom + "," + lonFrom)) : "");
      // Sygic custom URL: com.sygic.aura://coordinate|lon|lat|drive (docs).
      var sygicPath = "coordinate|" + lon + "|" + lat + "|drive";
      var sygic = openUrl(
        androidIntent(sygicPath, "com.sygic.aura", "com.sygic.aura", sygicWeb),
        "com.sygic.aura://" + sygicPath,
        sygicWeb
      );

      var organicQuery = "v2/nav?origin="
        + (hasFrom ? encodeURIComponent(latFrom + "," + lonFrom) : "currentLocation")
        + "&destination=" + encodeURIComponent(toPoint)
        + (name ? ("&destination_name=" + encodeURIComponent(name)) : "")
        + "&mode=drive";
      var organicScheme = "om://" + organicQuery;
      var organicWeb = "https://omaps.app/" + organicQuery;
      var organic = openUrl(
        androidIntent(organicQuery, "om", "app.organicmaps", organicWeb),
        organicScheme,
        organicScheme
      );

      var osmandWeb = hasFrom
        ? ("https://osmand.net/map/?start=" + encodeURIComponent(latFrom + "," + lonFrom)
          + "&finish=" + encodeURIComponent(toPoint) + "&type=osmand&profile=car#"
          + "14/" + lat + "/" + lon)
        : ("https://osmand.net/map/?pin=" + encodeURIComponent(toPoint)
          + "#14/" + lat + "/" + lon);
      var osmandPath = hasFrom
        ? ("osmand.net/map/?start=" + encodeURIComponent(latFrom + "," + lonFrom)
          + "&finish=" + encodeURIComponent(toPoint) + "&type=osmand&profile=car")
        : ("osmand.net/map/?pin=" + encodeURIComponent(toPoint));
      var osmand = openUrl(
        androidIntent(osmandPath, "https", "net.osmand", osmandWeb),
        osmandWeb,
        osmandWeb
      );

      var geo = "geo:" + toPoint
        + (name ? ("(" + encodeURIComponent(name) + ")") : "");

      // Waze is the second primary button — not repeated here.
      var otherApps = [
        { href: dgis, title: "2GIS", sub: android ? "intent:// · ru.dublgis.dgismobile" : "2gis.ru/routeSearch · app: 2gis" },
        { href: google, title: "Google Maps", sub: android ? "intent:// · com.google.android.apps.maps" : "maps/dir · app: google" },
        { href: apple, title: "Apple Maps", sub: "maps.apple.com · app: apple" },
        { href: here, title: "HERE WeGo", sub: android ? "intent:// · com.here.app.maps" : "share.here.com · app: here" },
        { href: sygic, title: "Sygic", sub: android ? "intent:// · com.sygic.aura" : "go.sygic.com · app: sygic" },
        { href: organic, title: "Organic Maps", sub: android ? "intent:// · app.organicmaps" : "om://v2/nav · app: organic" },
        { href: osmand, title: "OsmAnd", sub: android ? "intent:// · net.osmand" : "osmand.net/map · app: osmand" },
        { href: geo, title: msg("chooseApp"), sub: "Android · app: geo" }
      ];

      var aliases = {
        yandex: "yandex",
        navi: "yandex",
        yandexnavi: "yandex",
        "2gis": "2gis",
        dgis: "2gis",
        google: "google",
        gmaps: "google",
        waze: "waze",
        apple: "apple",
        applemaps: "apple",
        here: "here",
        wego: "here",
        sygic: "sygic",
        organic: "organic",
        organicmaps: "organic",
        om: "organic",
        osmand: "osmand",
        geo: "geo"
      };
      var selected = aliases[appParam] || "yandex";

      var autoTarget = yandexTarget;
      if (selected === "2gis") autoTarget = dgis;
      else if (selected === "google") autoTarget = google;
      else if (selected === "waze") autoTarget = waze;
      else if (selected === "apple") autoTarget = apple;
      else if (selected === "here") autoTarget = here;
      else if (selected === "sygic") autoTarget = sygic;
      else if (selected === "organic") autoTarget = organic;
      else if (selected === "osmand") autoTarget = osmand;
      else if (selected === "geo") autoTarget = geo;

      var copyText = hasFrom
        ? (latFrom + ", " + lonFrom + " → " + lat + ", " + lon)
        : (lat + ", " + lon);

      document.title = name ? msg("titleNamed", { name: name }) : msg("title");
      app.textContent = "";
      app.appendChild(el("h1", null, name || msg("route")));

      var coords = el("p", "coords");
      if (hasFrom) {
        coords.appendChild(el("span", null, msg("from", { a: latFrom + ", " + lonFrom })));
        coords.appendChild(document.createElement("br"));
        coords.appendChild(el("span", null, msg("to", { a: lat + ", " + lon })));
      } else {
        coords.textContent = lat + ", " + lon;
      }
      app.appendChild(coords);

      if (incompleteFrom) {
        app.appendChild(el("p", "muted", msg("incompleteFrom")));
      }

      if (!aliases[appParam]) {
        app.appendChild(el("p", "muted", msg("unknownApp", { app: appParam })));
      } else if (selected !== "yandex") {
        app.appendChild(el("p", "muted", msg("autoApp", { app: selected })));
      }

      // Keep Yandex primary exactly as before: real <a>, Android intent / else scheme.
      var primary = el("div", "actions");
      primary.appendChild(linkButton(
        yandexTarget,
        "btn",
        msg("openYandex"),
        android ? "intent:// · ru.yandex.yandexnavi" : "yandexnavi://"
      ));
      app.appendChild(primary);

      var extras = el("div", "actions");
      extras.appendChild(linkButton(
        waze,
        "btn-alt",
        msg("openWaze"),
        android ? "intent:// · com.waze" : (ios ? "waze:// · app: waze" : "waze.com/ul · app: waze")
      ));

      var copyBtn = el("button", "btn-copy", msg("copy"));
      copyBtn.type = "button";
      extras.appendChild(copyBtn);

      var toast = el("p", "toast", "");
      extras.appendChild(toast);
      app.appendChild(extras);

      app.appendChild(el("h2", null, msg("others")));
      var others = el("div", "actions");
      for (var i = 0; i < otherApps.length; i++) {
        others.appendChild(linkButton(otherApps[i].href, "btn-alt", otherApps[i].title, otherApps[i].sub));
      }
      others.appendChild(linkButton(dgisScheme, "btn-alt", msg("dgisApp"), msg("dgisAppSub")));
      app.appendChild(others);

      app.appendChild(el(
        "p",
        "hint muted",
        selected === "yandex" ? msg("hintYandex") : msg("hintApp", { app: selected })
      ));

      function setToast(text) {
        toast.textContent = text;
      }

      function copyCoords() {
        function ok() { setToast(msg("copied", { text: copyText })); }
        function fail() { setToast(msg("copyFail")); }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(copyText).then(ok, function () {
            fallbackCopy(copyText) ? ok() : fail();
          });
          return;
        }
        fallbackCopy(copyText) ? ok() : fail();
      }

      function fallbackCopy(text) {
        try {
          var area = document.createElement("textarea");
          area.value = text;
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.left = "-9999px";
          document.body.appendChild(area);
          area.select();
          area.setSelectionRange(0, text.length);
          var done = document.execCommand("copy");
          document.body.removeChild(area);
          return done;
        } catch (err) {
          return false;
        }
      }

      copyBtn.addEventListener("click", copyCoords);

      try {
        window.location.href = autoTarget;
      } catch (err) {}
    })();
  </script>
